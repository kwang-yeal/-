<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✈️ 김포→제주 좌석 모니터</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f0f4f8; color: #1e293b; font-family: -apple-system, 'Segoe UI', sans-serif; min-height: 100vh; }
  .header { background: linear-gradient(135deg, #1e40af, #3b82f6); padding: 18px 24px; display: flex; align-items: center; gap: 14px; color: #fff; }
  .header h1 { font-size: 18px; font-weight: 700; }
  .header p { font-size: 12px; opacity: 0.85; margin-top: 2px; }
  .gh-badge { margin-left: auto; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .config-panel { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 16px 24px; display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; }
  .cg { display: flex; flex-direction: column; gap: 4px; }
  .cg label { font-size: 11px; color: #64748b; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; }
  .cg input, .cg select { background: #f8fafc; border: 1px solid #cbd5e1; color: #1e293b; padding: 7px 10px; border-radius: 8px; font-size: 13px; outline: none; }
  .cg input:focus, .cg select:focus { border-color: #3b82f6; }
  .dates-wrap { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; min-height: 28px; }
  .date-chip { display: flex; align-items: center; gap: 4px; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 6px; padding: 4px 8px; font-size: 12px; color: #1d4ed8; }
  .date-chip button { background: none; border: none; cursor: pointer; color: #93c5fd; font-size: 14px; line-height: 1; padding: 0; }
  .date-chip button:hover { color: #1d4ed8; }
  .add-date { display: flex; gap: 6px; }
  .add-date input { width: 140px; }
  .btn-add { background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; padding: 7px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; font-weight: 600; }
  .time-range { display: flex; gap: 6px; align-items: center; }
  .time-range span { font-size: 12px; color: #94a3b8; }
  .time-range input { width: 90px; }
  .btn-search { background: #3b82f6; color: #fff; border: none; padding: 8px 20px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .btn-search:hover { background: #2563eb; }
  .info-bar { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 9px 24px; display: flex; align-items: center; gap: 14px; font-size: 12px; }
  .updated { color: #64748b; }
  .updated strong { color: #1e293b; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #22c55e; margin-right: 5px; animation: blink 2s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .notif-btn { margin-left: auto; background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; padding: 4px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; font-weight: 600; }
  .date-tabs { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 0 24px; display: flex; overflow-x: auto; }
  .date-tab { padding: 11px 16px; font-size: 13px; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; color: #64748b; white-space: nowrap; transition: all 0.2s; }
  .date-tab:hover { color: #1e293b; }
  .date-tab.active { color: #2563eb; border-bottom-color: #2563eb; }
  .avail-cnt { display: inline-block; background: #dcfce7; color: #16a34a; font-size: 10px; padding: 1px 6px; border-radius: 10px; margin-left: 5px; }
  .main { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
  .airline-section { background: #fff; border-radius: 12px; border: 1px solid #e2e8f0; overflow: hidden; }
  .airline-header { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid #f1f5f9; }
  .logo { width: 34px; height: 34px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: #fff; }
  .logo-lj { background: linear-gradient(135deg,#00408c,#0066cc); }
  .logo-jc { background: linear-gradient(135deg,#ff6b00,#ff9500); }
  .logo-tw { background: linear-gradient(135deg,#cc0000,#ff3333); }
  .airline-name { font-size: 15px; font-weight: 700; }
  .airline-st { margin-left: auto; font-size: 12px; color: #94a3b8; }
  .airline-st.ok { color: #16a34a; font-weight: 600; }
  .airline-st.err { color: #dc2626; }
  .flights-wrap { padding: 14px 18px; }
  .flights-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(175px,1fr)); gap: 10px; }
  .flight-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 13px; cursor: pointer; transition: all 0.2s; position: relative; }
  .flight-card:hover { border-color: #3b82f6; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59,130,246,0.1); }
  .flight-card.avail { border-color: #86efac; background: #f0fdf4; }
  .flight-card.sold { opacity: 0.4; }
  .avail-dot { position: absolute; top: 9px; right: 9px; width: 7px; height: 7px; border-radius: 50%; background: #22c55e; animation: blink 1.5s infinite; }
  .flight-no { font-size: 11px; font-weight: 700; color: #94a3b8; margin-bottom: 6px; }
  .flight-time { font-size: 20px; font-weight: 800; color: #1e293b; }
  .flight-time span { color: #94a3b8; font-size: 13px; font-weight: 400; margin: 0 4px; }
  .flight-price { margin-top: 6px; font-size: 14px; font-weight: 700; color: #2563eb; }
  .seat-badge { display: inline-block; margin-top: 5px; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 700; }
  .seat-ok { background: #dcfce7; color: #16a34a; }
  .seat-few { background: #fef9c3; color: #a16207; }
  .seat-no { background: #fee2e2; color: #dc2626; }
  .no-data { padding: 24px; text-align: center; color: #94a3b8; font-size: 13px; }
  .fallback { padding: 14px 18px; display: flex; align-items: center; gap: 12px; font-size: 13px; color: #64748b; }
  .fallback a { margin-left: auto; color: #2563eb; text-decoration: none; background: #eff6ff; border: 1px solid #bfdbfe; padding: 5px 12px; border-radius: 7px; font-size: 12px; font-weight: 600; }
  .loading { text-align: center; padding: 60px; color: #94a3b8; }
  .spinner { display: block; width: 28px; height: 28px; border: 3px solid #e2e8f0; border-top-color: #3b82f6; border-radius: 50%; margin: 12px auto 0; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-box { background: #fef2f2; border: 1px solid #fecaca; border-radius: 10px; padding: 16px; color: #dc2626; font-size: 13px; }
  .cfg-hint { background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 10px 14px; font-size: 12px; color: #92400e; }
  footer { text-align: center; padding: 20px; color: #94a3b8; font-size: 12px; border-top: 1px solid #e2e8f0; margin-top: 8px; }
  footer a { color: #64748b; text-decoration: none; }
</style>
</head>
<body>

<div class="header">
  <span style="font-size:26px">✈️</span>
  <div>
    <h1>김포 → 제주 좌석 모니터</h1>
    <p>GitHub Actions 자동 조회 · 매 5분 업데이트</p>
  </div>
  <div class="gh-badge">🤖 GitHub Actions</div>
</div>

<div class="config-panel">
  <div class="cg" style="flex:1;min-width:260px">
    <label>조회 날짜</label>
    <div id="dateChips" class="dates-wrap"></div>
    <div class="add-date">
      <input type="date" id="newDateInput" />
      <button class="btn-add" onclick="addDate()">+ 추가</button>
    </div>
  </div>
  <div class="cg">
    <label>성인</label>
    <select id="cfg_adults">
      <option value="1">1명</option><option value="2">2명</option>
      <option value="3">3명</option><option value="4">4명</option>
    </select>
  </div>
  <div class="cg">
    <label>어린이</label>
    <select id="cfg_children">
      <option value="0">0명</option><option value="1">1명</option>
      <option value="2">2명</option><option value="3">3명</option>
    </select>
  </div>
  <div class="cg">
    <label>출발 시간대</label>
    <div class="time-range">
      <input type="time" id="cfg_time_from" value="00:00" />
      <span>~</span>
      <input type="time" id="cfg_time_to" value="23:59" />
    </div>
  </div>
  <button class="btn-search" onclick="applyConfig()">🔍 적용</button>
</div>

<div class="info-bar">
  <span class="updated">마지막 업데이트: <strong id="updatedAt">로딩 중...</strong></span>
  <span id="alertCount" style="display:none;color:#16a34a;font-weight:600"></span>
  <button class="notif-btn" onclick="requestNotif()">🔔 알림</button>
  <span><span class="dot"></span>자동 새로고침</span>
</div>

<div class="date-tabs" id="dateTabs"></div>
<div class="main" id="main">
  <div class="loading">데이터 로딩 중...<div class="spinner"></div></div>
</div>

<footer>데이터: <a href="data/flights.json" target="_blank">flights.json</a> · GitHub Actions 5분마다 자동 업데이트</footer>

<script>
let currentDate=null, flightData=null;
let prevKeys=new Set(JSON.parse(localStorage.getItem('availKeys')||'[]'));
let cfg=JSON.parse(localStorage.getItem('flightCfg')||'{}');
let selDates=cfg.dates||[];

document.getElementById('cfg_adults').value=cfg.adults||'1';
document.getElementById('cfg_children').value=cfg.children||'0';
document.getElementById('cfg_time_from').value=cfg.timeFrom||'00:00';
document.getElementById('cfg_time_to').value=cfg.timeTo||'23:59';

if(!selDates.length){
  for(let i=1;i<=3;i++){const d=new Date();d.setDate(d.getDate()+i);selDates.push(d.toISOString().slice(0,10).replace(/-/g,''));}
}
renderChips();

function renderChips(){
  document.getElementById('dateChips').innerHTML=selDates.map(d=>
    `<div class="date-chip">${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6)}<button onclick="removeDate('${d}')">×</button></div>`
  ).join('');
  const t=new Date();t.setDate(t.getDate()+1);
  document.getElementById('newDateInput').value=t.toISOString().slice(0,10);
}

function addDate(){
  const v=document.getElementById('newDateInput').value.replace(/-/g,'');
  if(v&&!selDates.includes(v)){selDates.push(v);selDates.sort();renderChips();}
}
function removeDate(d){selDates=selDates.filter(x=>x!==d);renderChips();}

function applyConfig(){
  const adults=document.getElementById('cfg_adults').value;
  const children=document.getElementById('cfg_children').value;
  const tf=document.getElementById('cfg_time_from').value;
  const tt=document.getElementById('cfg_time_to').value;
  cfg={dates:selDates,adults,children,timeFrom:tf,timeTo:tt};
  localStorage.setItem('flightCfg',JSON.stringify(cfg));
  alert(`✅ 화면 필터 적용!\n\nGitHub 자동 조회 설정도 바꾸려면:\nSettings → Variables → Actions 에서\n\nTARGET_DATES = ${selDates.join(',')}\nADULT_COUNT = ${adults}\nCHILD_COUNT = ${children}\nDEP_TIME_FROM = ${tf.replace(':','')}\nDEP_TIME_TO = ${tt.replace(':','')}\n\n설정 후 Actions 재실행`);
  render();
}

function inTime(t){
  if(!t)return true;
  const v=t.replace(':','');
  const f=(cfg.timeFrom||'00:00').replace(':','');
  const e=(cfg.timeTo||'23:59').replace(':','');
  return v>=f&&v<=e;
}

async function loadData(){
  try{
    const r=await fetch(`data/flights.json?t=${Date.now()}`);
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    flightData=await r.json();render();
  }catch(e){
    document.getElementById('main').innerHTML=`<div class="error-box">⚠️ 로드 실패: ${e.message}</div>`;
  }
}

function render(){
  if(!flightData)return;
  document.getElementById('updatedAt').textContent=flightData.updatedAt+' KST';
  const dates=[...new Set(flightData.results.map(r=>r.date))];
  if(!currentDate||!dates.includes(currentDate))currentDate=dates[0];
  document.getElementById('dateTabs').innerHTML=dates.map(d=>{
    const av=flightData.results.filter(r=>r.date===d).reduce((s,r)=>s+(r.flights||[]).filter(f=>f.available&&inTime(f.depTime)).length,0);
    return `<div class="date-tab ${d===currentDate?'active':''}" onclick="selectDate('${d}')">${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6)}${av>0?`<span class="avail-cnt">${av}</span>`:''}</div>`;
  }).join('');
  renderDate(currentDate);checkNewAvail();
}

function selectDate(d){currentDate=d;render();}

function renderDate(date){
  const results=flightData.results.filter(r=>r.date===date);
  const main=document.getElementById('main');
  if(!results.length){main.innerHTML=`<div class="no-data">데이터 없음</div>`;return;}
  const logos={jinair:'logo-lj',jejuair:'logo-jc',tway:'logo-tw'};
  const codes={jinair:'LJ',jejuair:'7C',tway:'TW'};
  main.innerHTML=results.map(r=>{
    const fl=(r.flights||[]).filter(f=>inTime(f.depTime));
    const av=fl.filter(f=>f.available).length;
    const hasErr=!!r.error;
    let content='';
    if(r.fallbackUrl&&!fl.length){
      content=`<div class="fallback"><span>⚠️ ${r.note||'직접 조회 불가'}</span><a href="${r.fallbackUrl}" target="_blank">예매 페이지 열기 →</a></div>`;
    }else if(!fl.length){
      content=`<div class="flights-wrap"><div class="no-data">${hasErr?'⚠️ '+r.error:'해당 시간대 항공편 없음'}</div></div>`;
    }else{
      content=`<div class="flights-wrap"><div class="flights-grid">${fl.map(f=>card(r.airline,f,date)).join('')}</div></div>`;
    }
    return `<div class="airline-section">
      <div class="airline-header">
        <div class="logo ${logos[r.airline]||'logo-lj'}">${codes[r.airline]||'?'}</div>
        <span class="airline-name">${r.name}</span>
        <span class="airline-st ${av>0?'ok':hasErr?'err':''}">${hasErr&&!r.flights?.length?'⚠️ 오류':av>0?`✅ ${av}편 잔여`:'✗ 잔여 없음'}</span>
      </div>${content}</div>`;
  }).join('');
  const total=results.reduce((s,r)=>s+(r.flights||[]).filter(f=>f.available&&inTime(f.depTime)).length,0);
  const cnt=document.getElementById('alertCount');
  if(total>0){cnt.textContent=`🎉 ${date.slice(4,6)}/${date.slice(6)} 잔여 ${total}편`;cnt.style.display='inline';}
  else cnt.style.display='none';
}

function card(airline,f,date){
  const sc=!f.available?'no':f.seats<=3?'few':'ok';
  return `<div class="flight-card ${f.available?'avail':'sold'}" onclick="window.open('${f.bookingUrl}','_blank')">
    ${f.available?'<div class="avail-dot"></div>':''}
    <div class="flight-no">${f.flightNo||''}</div>
    <div class="flight-time">${f.depTime||'--:--'}<span>→</span>${f.arrTime||'--:--'}</div>
    ${f.price?`<div class="flight-price">₩${Number(f.price).toLocaleString()}</div>`:''}
    <div class="seat-badge seat-${sc}">${f.available?f.seats+'석':'매진'}</div>
  </div>`;
}

function checkNewAvail(){
  const keys=new Set(),newOnes=[];
  (flightData?.results||[]).forEach(r=>{
    (r.flights||[]).filter(f=>f.available&&inTime(f.depTime)).forEach(f=>{
      const k=`${r.airline}-${f.flightNo}-${r.date}`;
      keys.add(k);
      if(!prevKeys.has(k))newOnes.push(`${r.name} ${f.flightNo} ${f.depTime}`);
    });
  });
  if(newOnes.length&&Notification.permission==='granted'){
    new Notification('✈️ 잔여석 발견!',{body:newOnes.join('\n')});beep();
  }
  prevKeys=keys;localStorage.setItem('availKeys',JSON.stringify([...keys]));
}

function beep(){
  try{const ac=new(window.AudioContext||window.webkitAudioContext)();[523,659,784].forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=f;o.type='sine';const t=ac.currentTime+i*.15;g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3);});}catch(e){}
}

function requestNotif(){Notification.requestPermission().then(p=>alert(p==='granted'?'✅ 알림 허용됨!':'알림이 거부되었습니다.'));}

loadData();
setInterval(loadData,30000);
</script>
</body>
</html>
