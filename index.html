<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✈️ 김포→제주 항공권 바로가기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f0f4f8; color: #1e293b; font-family: -apple-system, 'Segoe UI', sans-serif; min-height: 100vh; }
  .header { background: linear-gradient(135deg, #1e40af, #3b82f6); padding: 16px 24px; display: flex; align-items: center; gap: 12px; color: #fff; }
  .header h1 { font-size: 17px; font-weight: 700; }
  .header p { font-size: 11px; opacity: 0.85; margin-top: 2px; }

  .config-panel { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 16px 24px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  .cg { display: flex; flex-direction: column; gap: 4px; }
  .cg label { font-size: 11px; color: #64748b; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; }
  .cg input, .cg select { background: #f8fafc; border: 1px solid #cbd5e1; color: #1e293b; padding: 7px 10px; border-radius: 8px; font-size: 13px; outline: none; }
  .cg input:focus, .cg select:focus { border-color: #3b82f6; }
  .dates-wrap { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; min-height: 28px; }
  .date-chip { display: flex; align-items: center; gap: 4px; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 6px; padding: 4px 8px; font-size: 12px; color: #1d4ed8; }
  .date-chip button { background: none; border: none; cursor: pointer; color: #93c5fd; font-size: 14px; line-height: 1; padding: 0; }
  .add-date { display: flex; gap: 6px; }
  .add-date input { width: 140px; }
  .btn-add { background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; padding: 7px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; font-weight: 600; }
  .time-range { display: flex; gap: 6px; align-items: center; }
  .time-range span { font-size: 12px; color: #94a3b8; }
  .time-range input { width: 88px; }

  .btn-open-all { background: #3b82f6; color: #fff; border: none; padding: 10px 24px; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .btn-open-all:hover { background: #2563eb; }

  .main { padding: 20px 24px; display: flex; flex-direction: column; gap: 24px; }

  .date-section { display: flex; flex-direction: column; gap: 10px; }
  .date-header { background: #1e40af; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 15px; font-weight: 700; }

  .airlines-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }

  .airline-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; transition: all 0.2s; }
  .airline-card:hover { border-color: #3b82f6; box-shadow: 0 4px 12px rgba(59,130,246,0.1); transform: translateY(-1px); }
  .airline-top { display: flex; align-items: center; gap: 10px; }
  .logo { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: #fff; flex-shrink: 0; }
  .logo-lj { background: linear-gradient(135deg,#00408c,#0066cc); }
  .logo-jc { background: linear-gradient(135deg,#ff6b00,#ff9500); }
  .logo-tw { background: linear-gradient(135deg,#cc0000,#ff3333); }
  .logo-oz { background: linear-gradient(135deg,#0055a4,#0099cc); }
  .logo-ke { background: linear-gradient(135deg,#00256c,#003DA6); }
  .logo-rs { background: linear-gradient(135deg,#e65c00,#f9a825); }
  .logo-bx { background: linear-gradient(135deg,#e60012,#ff6b6b); }
  .logo-ze { background: linear-gradient(135deg,#ff6600,#ffaa00); }
  .logo-naver { background: linear-gradient(135deg,#03c75a,#00a847); }
  .airline-name { font-size: 14px; font-weight: 700; color: #1e293b; }
  .airline-sub { font-size: 11px; color: #94a3b8; margin-top: 1px; }
  .btn-open { width: 100%; background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; padding: 8px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.2s; }
  .btn-open:hover { background: #dbeafe; }

  .naver-card { background: #f0fdf4; border-color: #86efac; }
  .naver-card .btn-open { background: #dcfce7; border-color: #86efac; color: #16a34a; }
  .naver-card .btn-open:hover { background: #bbf7d0; }

  footer { text-align: center; padding: 20px; color: #94a3b8; font-size: 12px; border-top: 1px solid #e2e8f0; margin-top: 8px; }
</style>
</head>
<body>

<div class="header">
  <span style="font-size:24px">✈️</span>
  <div>
    <h1>김포 → 제주 항공권 바로가기</h1>
    <p>날짜/인원 설정 후 항공사 페이지를 한번에 열기</p>
  </div>
</div>

<div class="config-panel">
  <div class="cg" style="flex:1;min-width:240px">
    <label>조회 날짜</label>
    <div id="dateChips" class="dates-wrap"></div>
    <div class="add-date">
      <input type="date" id="newDateInput" />
      <button class="btn-add" onclick="addDate()">+ 추가</button>
    </div>
  </div>
  <div class="cg">
    <label>성인</label>
    <select id="cfg_adults">
      <option value="1">1명</option><option value="2">2명</option>
      <option value="3">3명</option><option value="4">4명</option>
    </select>
  </div>
  <div class="cg">
    <label>어린이</label>
    <select id="cfg_children">
      <option value="0">0명</option><option value="1">1명</option>
      <option value="2">2명</option><option value="3">3명</option>
    </select>
  </div>
  <button class="btn-open-all" onclick="openAll()">🚀 전체 새탭으로 열기</button>
</div>

<div class="main" id="main"></div>

<footer>각 버튼 클릭 시 해당 항공사 예매 페이지가 새 탭으로 열립니다</footer>

<script>
let cfg = JSON.parse(localStorage.getItem('flightCfg3') || '{}');
let selDates = cfg.dates || [];

document.getElementById('cfg_adults').value = cfg.adults || '1';
document.getElementById('cfg_children').value = cfg.children || '0';

if (!selDates.length) {
  for (let i = 1; i <= 3; i++) {
    const d = new Date(); d.setDate(d.getDate() + i);
    selDates.push(d.toISOString().slice(0,10).replace(/-/g,''));
  }
}
renderChips();
render();

function renderChips() {
  document.getElementById('dateChips').innerHTML = selDates.map(d =>
    `<div class="date-chip">${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6)}<button onclick="removeDate('${d}')">×</button></div>`
  ).join('');
  const t = new Date(); t.setDate(t.getDate() + 1);
  document.getElementById('newDateInput').value = t.toISOString().slice(0,10);
}

function addDate() {
  const v = document.getElementById('newDateInput').value.replace(/-/g,'');
  if (v && !selDates.includes(v)) { selDates.push(v); selDates.sort(); renderChips(); saveConfig(); render(); }
}
function removeDate(d) { selDates = selDates.filter(x => x !== d); renderChips(); saveConfig(); render(); }

function saveConfig() {
  cfg = {
    dates: selDates,
    adults: document.getElementById('cfg_adults').value,
    children: document.getElementById('cfg_children').value,
  };
  localStorage.setItem('flightCfg3', JSON.stringify(cfg));
}

document.getElementById('cfg_adults').addEventListener('change', () => { saveConfig(); render(); });
document.getElementById('cfg_children').addEventListener('change', () => { saveConfig(); render(); });

function getAirlines(date, adults, children) {
  const d = `${date.slice(0,4)}-${date.slice(4,6)}-${date.slice(6)}`;
  const infant = 0;
  return [
    {
      id: 'naver', name: '네이버 항공권', sub: '전체 항공사 비교', logoClass: 'logo-naver', code: 'N',
      url: `https://flight.naver.com/flights/domestic/GMP-CJU-${date}?adult=${adults}&child=${children}&infant=${infant}`,
      isNaver: true
    },
    {
      id: 'jinair', name: '진에어', sub: 'LJ · Jin Air', logoClass: 'logo-lj', code: 'LJ',
      url: `https://www.jinair.com/booking/selectSchedule?tripType=OW&origin1=GMP&destination1=CJU&travelDate1=${date}&adultPaxCount=${adults}&childPaxCount=${children}&infantPaxCount=0&pointOfPurchase=KR`
    },
    {
      id: 'jejuair', name: '제주항공', sub: '7C · Jeju Air', logoClass: 'logo-jc', code: '7C',
      url: `https://www.jejuair.net/ko/ibe/booking/selectSchedule.do?tripType=OW&depAirport=GMP&arrAirport=CJU&depDate=${date}&paxType=ADT&paxCount=${parseInt(adults)+parseInt(children)}`
    },
    {
      id: 'tway', name: '티웨이항공', sub: 'TW · T\'way Air', logoClass: 'logo-tw', code: 'TW',
      url: `https://www.twayair.com/app/booking/chooseItinerary?tripType=OW&depAirport=GMP&arrAirport=CJU&depDate=${date}&paxType=ADT&paxCount=${adults}`
    },
    {
      id: 'airseoul', name: '에어서울', sub: 'RS · Air Seoul', logoClass: 'logo-rs', code: 'RS',
      url: `https://flyairseoul.com/CW/ko/selectFlight.do?tripType=OW&depAirport=GMP&arrAirport=CJU&depDate=${d}&adultCount=${adults}&childCount=${children}&infantCount=0`
    },
    {
      id: 'airbusan', name: '에어부산', sub: 'BX · Air Busan', logoClass: 'logo-bx', code: 'BX',
      url: `https://www.airbusan.com/ibe/booking/flight?depAirport=GMP&arrAirport=CJU&depDate=${date}&tripType=OW&adultCount=${adults}&childCount=${children}&infantCount=0`
    },
    {
      id: 'asiana', name: '아시아나항공', sub: 'OZ · Asiana', logoClass: 'logo-oz', code: 'OZ',
      url: `https://flyasiana.com/C/KR/KO/booking/availableStatus?tripType=OW&depAirport=GMP&arrAirport=CJU&depDate=${d}&adultCount=${adults}&childCount=${children}&infantCount=0`
    },
    {
      id: 'korean', name: '대한항공', sub: 'KE · Korean Air', logoClass: 'logo-ke', code: 'KE',
      url: `https://www.koreanair.com/booking/availability?dep=GMP&arr=CJU&depDate=${d}&tripType=OW&adult=${adults}&child=${children}&infant=0`
    },
  ];
}

function render() {
  const adults = document.getElementById('cfg_adults').value;
  const children = document.getElementById('cfg_children').value;
  const main = document.getElementById('main');

  if (!selDates.length) {
    main.innerHTML = '<div style="text-align:center;padding:40px;color:#94a3b8">날짜를 추가해주세요</div>';
    return;
  }

  main.innerHTML = selDates.map(date => {
    const airlines = getAirlines(date, adults, children);
    return `<div class="date-section">
      <div class="date-header">📅 ${date.slice(0,4)}-${date.slice(4,6)}-${date.slice(6)} · 성인 ${adults}명${children > 0 ? ` 어린이 ${children}명` : ''}</div>
      <div class="airlines-grid">
        ${airlines.map(a => `
          <div class="airline-card ${a.isNaver ? 'naver-card' : ''}">
            <div class="airline-top">
              <div class="logo ${a.logoClass}">${a.code}</div>
              <div>
                <div class="airline-name">${a.name}</div>
                <div class="airline-sub">${a.sub}</div>
              </div>
            </div>
            <button class="btn-open" onclick="window.open('${a.url}','_blank')">
              ${a.isNaver ? '🔍 전체 비교하기' : '예매 페이지 열기 →'}
            </button>
          </div>
        `).join('')}
      </div>
    </div>`;
  }).join('');
}

function openAll() {
  const adults = document.getElementById('cfg_adults').value;
  const children = document.getElementById('cfg_children').value;
  saveConfig();

  if (!selDates.length) { alert('날짜를 추가해주세요!'); return; }

  let count = 0;
  for (const date of selDates) {
    const airlines = getAirlines(date, adults, children);
    for (const a of airlines) {
      setTimeout(() => window.open(a.url, '_blank'), count * 300);
      count++;
    }
  }
  render();
}
</script>
</body>
</html>
