<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✈️ 김포→제주 좌석 모니터</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #f0f4f8; color: #1e293b; font-family: -apple-system, 'Segoe UI', sans-serif; min-height: 100vh; }
  .header { background: linear-gradient(135deg, #1e40af, #3b82f6); padding: 18px 24px; display: flex; align-items: center; gap: 14px; color: #fff; }
  .header h1 { font-size: 18px; font-weight: 700; }
  .header p { font-size: 12px; opacity: 0.85; margin-top: 2px; }
  .naver-badge { margin-left: auto; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
  .config-panel { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 14px 24px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  .cg { display: flex; flex-direction: column; gap: 4px; }
  .cg label { font-size: 11px; color: #64748b; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; }
  .cg input, .cg select { background: #f8fafc; border: 1px solid #cbd5e1; color: #1e293b; padding: 7px 10px; border-radius: 8px; font-size: 13px; outline: none; }
  .cg input:focus, .cg select:focus { border-color: #3b82f6; }
  .dates-wrap { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; min-height: 28px; }
  .date-chip { display: flex; align-items: center; gap: 4px; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 6px; padding: 4px 8px; font-size: 12px; color: #1d4ed8; }
  .date-chip button { background: none; border: none; cursor: pointer; color: #93c5fd; font-size: 14px; line-height: 1; padding: 0; }
  .add-date { display: flex; gap: 6px; }
  .add-date input { width: 140px; }
  .btn-add { background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; padding: 7px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; font-weight: 600; }
  .time-range { display: flex; gap: 6px; align-items: center; }
  .time-range span { font-size: 12px; color: #94a3b8; }
  .time-range input { width: 88px; }
  .btn-search { background: #3b82f6; color: #fff; border: none; padding: 8px 18px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .btn-search:hover { background: #2563eb; }
  .btn-search:disabled { background: #94a3b8; cursor: not-allowed; }
  .btn-stop { background: #ef4444; color: #fff; border: none; padding: 8px 18px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; white-space: nowrap; display: none; }
  .btn-stop:hover { background: #dc2626; }
  .info-bar { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 9px 24px; display: flex; align-items: center; gap: 12px; font-size: 12px; flex-wrap: wrap; }
  .updated { color: #64748b; }
  .updated strong { color: #1e293b; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #22c55e; margin-right: 4px; animation: blink 2s infinite; }
  .dot.red { background: #ef4444; animation: none; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .notif-btn { background: #eff6ff; border: 1px solid #bfdbfe; color: #1d4ed8; padding: 4px 12px; border-radius: 8px; font-size: 12px; cursor: pointer; font-weight: 600; }
  .auto-label { color: #64748b; display: flex; align-items: center; gap: 6px; }
  .auto-label select { padding: 3px 6px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 12px; background: #f8fafc; }
  .countdown { font-size: 11px; color: #3b82f6; font-weight: 700; min-width: 30px; }
  .date-tabs { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 0 24px; display: flex; overflow-x: auto; }
  .date-tab { padding: 11px 16px; font-size: 13px; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; color: #64748b; white-space: nowrap; transition: all 0.2s; }
  .date-tab:hover { color: #1e293b; }
  .date-tab.active { color: #2563eb; border-bottom-color: #2563eb; }
  .avail-cnt { display: inline-block; background: #dcfce7; color: #16a34a; font-size: 10px; padding: 1px 6px; border-radius: 10px; margin-left: 5px; }
  .main { padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; }
  .flight-card { background: #fff; border-radius: 12px; border: 1px solid #e2e8f0; padding: 16px 20px; display: flex; align-items: center; gap: 16px; cursor: pointer; transition: all 0.2s; }
  .flight-card:hover { border-color: #3b82f6; box-shadow: 0 4px 12px rgba(59,130,246,0.1); transform: translateY(-1px); }
  .flight-card.avail { border-color: #86efac; background: #f0fdf4; }
  .airline-logo { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: #fff; flex-shrink: 0; }
  .logo-lj { background: linear-gradient(135deg,#00408c,#0066cc); }
  .logo-jc { background: linear-gradient(135deg,#ff6b00,#ff9500); }
  .logo-tw { background: linear-gradient(135deg,#cc0000,#ff3333); }
  .logo-oa { background: linear-gradient(135deg,#0055a4,#0077cc); }
  .logo-bx { background: linear-gradient(135deg,#e60012,#ff3344); }
  .logo-rs { background: linear-gradient(135deg,#ff6600,#ff8800); }
  .logo-default { background: linear-gradient(135deg,#64748b,#94a3b8); }
  .flight-info { flex: 1; }
  .flight-route { font-size: 22px; font-weight: 800; color: #1e293b; letter-spacing: -0.5px; }
  .flight-route span { color: #94a3b8; font-size: 16px; font-weight: 400; margin: 0 6px; }
  .flight-meta { font-size: 12px; color: #64748b; margin-top: 3px; }
  .flight-right { text-align: right; flex-shrink: 0; }
  .flight-price { font-size: 20px; font-weight: 800; color: #2563eb; }
  .flight-price small { font-size: 12px; font-weight: 400; color: #94a3b8; }
  .avail-badge { display: inline-block; margin-top: 4px; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
  .avail-ok { background: #dcfce7; color: #16a34a; }
  .avail-few { background: #fef9c3; color: #a16207; }
  .avail-none { background: #fee2e2; color: #dc2626; }
  .avail-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #22c55e; margin-right: 4px; animation: blink 1.5s infinite; }
  .no-data { background: #fff; border-radius: 12px; border: 1px solid #e2e8f0; padding: 40px; text-align: center; color: #94a3b8; font-size: 14px; }
  .loading { text-align: center; padding: 60px; color: #94a3b8; }
  .spinner { display: block; width: 28px; height: 28px; border: 3px solid #e2e8f0; border-top-color: #3b82f6; border-radius: 50%; margin: 12px auto 0; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-box { background: #fef2f2; border: 1px solid #fecaca; border-radius: 10px; padding: 16px; color: #dc2626; font-size: 13px; }
  .naver-link { display: block; text-align: center; margin-top: 8px; color: #2563eb; font-size: 13px; text-decoration: none; }
  .naver-link:hover { text-decoration: underline; }
  footer { text-align: center; padding: 20px; color: #94a3b8; font-size: 12px; border-top: 1px solid #e2e8f0; margin-top: 8px; }
</style>
</head>
<body>

<div class="header">
  <span style="font-size:26px">✈️</span>
  <div>
    <h1>김포 → 제주 좌석 모니터</h1>
    <p>네이버 항공권 실시간 조회</p>
  </div>
  <div class="naver-badge">🟢 네이버 항공</div>
</div>

<div class="config-panel">
  <div class="cg" style="flex:1;min-width:240px">
    <label>조회 날짜</label>
    <div id="dateChips" class="dates-wrap"></div>
    <div class="add-date">
      <input type="date" id="newDateInput" />
      <button class="btn-add" onclick="addDate()">+ 추가</button>
    </div>
  </div>
  <div class="cg">
    <label>성인</label>
    <select id="cfg_adults">
      <option value="1">1명</option><option value="2">2명</option>
      <option value="3">3명</option><option value="4">4명</option>
    </select>
  </div>
  <div class="cg">
    <label>어린이</label>
    <select id="cfg_children">
      <option value="0">0명</option><option value="1">1명</option>
      <option value="2">2명</option><option value="3">3명</option>
    </select>
  </div>
  <div class="cg">
    <label>출발 시간</label>
    <div class="time-range">
      <input type="time" id="cfg_time_from" value="00:00" />
      <span>~</span>
      <input type="time" id="cfg_time_to" value="23:59" />
    </div>
  </div>
  <button class="btn-search" id="searchBtn" onclick="startSearch()">🔍 조회 시작</button>
  <button class="btn-stop" id="stopBtn" onclick="stopSearch()">⏹ 중단</button>
</div>

<div class="info-bar">
  <span class="updated">마지막 조회: <strong id="updatedAt">-</strong></span>
  <span id="alertCount" style="display:none;color:#16a34a;font-weight:600"></span>
  <span class="auto-label">
    자동반복:
    <select id="autoInterval">
      <option value="60">1분</option>
      <option value="180">3분</option>
      <option value="300" selected>5분</option>
      <option value="600">10분</option>
    </select>
    <span class="countdown" id="countdown"></span>
  </span>
  <button class="notif-btn" onclick="requestNotif()">🔔 알림</button>
  <span id="statusDot"><span class="dot red"></span>대기 중</span>
</div>

<div class="date-tabs" id="dateTabs"></div>
<div class="main" id="main">
  <div class="no-data">📅 날짜 선택 후 <strong>조회 시작</strong> 버튼을 눌러주세요</div>
</div>
<footer>네이버 항공권 데이터 · 카드 클릭 시 예매 페이지로 이동</footer>

<script>
const PROXY = 'https://flight-proxy.jajadoo.workers.dev';
let cfg = JSON.parse(localStorage.getItem('flightCfg') || '{}');
let selDates = cfg.dates || [];
let results = {};
let currentDate = null;
let prevKeys = new Set(JSON.parse(localStorage.getItem('availKeys') || '[]'));
let autoTimer = null;
let countdownTimer = null;
let nextRunAt = null;
let isRunning = false;

document.getElementById('cfg_adults').value = cfg.adults || '1';
document.getElementById('cfg_children').value = cfg.children || '0';
document.getElementById('cfg_time_from').value = cfg.timeFrom || '00:00';
document.getElementById('cfg_time_to').value = cfg.timeTo || '23:59';

if (!selDates.length) {
  for (let i = 1; i <= 3; i++) {
    const d = new Date(); d.setDate(d.getDate() + i);
    selDates.push(d.toISOString().slice(0,10).replace(/-/g,''));
  }
}
renderChips();

function renderChips() {
  document.getElementById('dateChips').innerHTML = selDates.map(d =>
    `<div class="date-chip">${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6)}<button onclick="removeDate('${d}')">×</button></div>`
  ).join('');
  const t = new Date(); t.setDate(t.getDate() + 1);
  document.getElementById('newDateInput').value = t.toISOString().slice(0,10);
}
function addDate() {
  const v = document.getElementById('newDateInput').value.replace(/-/g,'');
  if (v && !selDates.includes(v)) { selDates.push(v); selDates.sort(); renderChips(); }
}
function removeDate(d) { selDates = selDates.filter(x => x !== d); renderChips(); }

function saveConfig() {
  cfg = {
    dates: selDates,
    adults: document.getElementById('cfg_adults').value,
    children: document.getElementById('cfg_children').value,
    timeFrom: document.getElementById('cfg_time_from').value,
    timeTo: document.getElementById('cfg_time_to').value,
  };
  localStorage.setItem('flightCfg', JSON.stringify(cfg));
}

function inTime(t) {
  if (!t) return true;
  const v = t.replace(':', '');
  const f = (cfg.timeFrom || '00:00').replace(':', '');
  const e = (cfg.timeTo || '23:59').replace(':', '');
  return v >= f && v <= e;
}

function startSearch() {
  if (!selDates.length) { alert('날짜를 추가해주세요!'); return; }
  saveConfig();
  isRunning = true;
  document.getElementById('searchBtn').style.display = 'none';
  document.getElementById('stopBtn').style.display = 'inline-block';
  document.getElementById('statusDot').innerHTML = '<span class="dot"></span>조회 중...';
  doSearch();
  scheduleNext();
}

function stopSearch() {
  isRunning = false;
  if (autoTimer) clearTimeout(autoTimer);
  if (countdownTimer) clearInterval(countdownTimer);
  document.getElementById('searchBtn').style.display = 'inline-block';
  document.getElementById('stopBtn').style.display = 'none';
  document.getElementById('statusDot').innerHTML = '<span class="dot red"></span>중단됨';
  document.getElementById('countdown').textContent = '';
}

function scheduleNext() {
  if (autoTimer) clearTimeout(autoTimer);
  if (countdownTimer) clearInterval(countdownTimer);
  if (!isRunning) return;
  const sec = parseInt(document.getElementById('autoInterval').value);
  nextRunAt = Date.now() + sec * 1000;
  autoTimer = setTimeout(() => { if (isRunning) { doSearch(); scheduleNext(); } }, sec * 1000);
  countdownTimer = setInterval(() => {
    if (!isRunning) { clearInterval(countdownTimer); return; }
    const remaining = Math.max(0, Math.ceil((nextRunAt - Date.now()) / 1000));
    document.getElementById('countdown').textContent = remaining > 0 ? `${remaining}초 후` : '';
  }, 1000);
}

function inTime(t) {
  if (!t) return true;
  const v = t.replace(':', '');
  const f = (cfg.timeFrom || '00:00').replace(':', '');
  const e = (cfg.timeTo || '23:59').replace(':', '');
  return v >= f && v <= e;
}

// ── 네이버 항공권 API ──
async function fetchNaver(date, adults, children) {
  const infant = 0;
  // 네이버 항공권 API
  const apiUrl = `https://airline-api.naver.com/graphql`;
  const query = {
    operationName: "getFlightList",
    variables: {
      ignoreExistsSearch: false,
      isDomestic: true,
      itinerary: [{
        departureAirport: "GMP",
        arrivalAirport: "CJU",
        departureDate: `${date.slice(0,4)}-${date.slice(4,6)}-${date.slice(6)}`
      }],
      paxCount: { adult: parseInt(adults), child: parseInt(children), infant },
      fareType: "Y",
      trip: "OW"
    },
    query: `query getFlightList($itinerary:[ItineraryInput]!,$paxCount:PaxCountInput!,$fareType:String,$trip:String,$isDomestic:Boolean,$ignoreExistsSearch:Boolean){
      flightList(itinerary:$itinerary,paxCount:$paxCount,fareType:$fareType,trip:$trip,isDomestic:$isDomestic,ignoreExistsSearch:$ignoreExistsSearch){
        results{
          airline{code name}
          departure{airport{code} time}
          arrival{airport{code} time}
          flightNumber
          fareInfo{fareAdult seatCount}
          lowestFare{fare}
        }
      }
    }`
  };

  const proxyUrl = `${PROXY}?url=${encodeURIComponent(apiUrl)}`;
  try {
    const r = await fetch(proxyUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'referer': 'https://flight.naver.com/' },
      body: JSON.stringify(query)
    });
    const data = await r.json();
    const flightList = data?.data?.flightList?.results || [];
    const bookingBase = `https://flight.naver.com/flights/domestic/GMP-CJU-${date}?adult=${adults}&child=${children}&infant=${infant}`;

    return flightList
      .filter(f => inTime(f.departure?.time?.slice(11,16)))
      .map(f => ({
        airline: f.airline?.code || '',
        airlineName: f.airline?.name || '',
        flightNo: f.flightNumber || '',
        depTime: (f.departure?.time || '').slice(11,16),
        arrTime: (f.arrival?.time || '').slice(11,16),
        price: f.fareInfo?.fareAdult || f.lowestFare?.fare,
        seats: f.fareInfo?.seatCount || 0,
        available: (f.fareInfo?.seatCount || 0) > 0,
        bookingUrl: bookingBase,
      }));
  } catch(e) {
    console.error('네이버 API 오류:', e);
    return null; // null이면 HTML 파싱 시도
  }
}

// ── 네이버 항공권 HTML 파싱 (API 실패 시 fallback) ──
async function fetchNaverHTML(date, adults, children) {
  const pageUrl = `https://flight.naver.com/flights/domestic/GMP-CJU-${date}?adult=${adults}&child=${children}&infant=0`;
  const proxyUrl = `${PROXY}?url=${encodeURIComponent(pageUrl)}`;
  try {
    const r = await fetch(proxyUrl);
    const html = await r.text();
    // 인라인 JSON 데이터 찾기
    const m = html.match(/__NEXT_DATA__[^>]*>(\{[\s\S]*?\})<\/script>/);
    if (m) {
      const data = JSON.parse(m[1]);
      const flights = data?.props?.pageProps?.initialState?.flightSearch?.results || [];
      return flights.filter(f => inTime(f.depTime)).map(f => ({
        airline: f.airlineCode || '',
        airlineName: f.airlineName || '',
        flightNo: f.flightNo || '',
        depTime: f.depTime || '',
        arrTime: f.arrTime || '',
        price: f.price || f.lowestFare,
        seats: f.seatCount || 0,
        available: (f.seatCount || 0) > 0,
        bookingUrl: pageUrl,
      }));
    }
    return [];
  } catch(e) {
    return [];
  }
}

async function doSearch() {
  document.getElementById('statusDot').innerHTML = '<span class="dot"></span>조회 중...';
  const adults = cfg.adults || '1';
  const children = cfg.children || '0';

  for (const date of selDates) {
    let flights = await fetchNaver(date, adults, children);
    if (!flights || flights.length === 0) {
      flights = await fetchNaverHTML(date, adults, children);
    }
    results[date] = flights;
  }

  const now = new Date().toLocaleString('ko-KR', {timeZone:'Asia/Seoul'});
  document.getElementById('updatedAt').textContent = now;
  document.getElementById('statusDot').innerHTML = '<span class="dot"></span>완료';

  if (!currentDate || !selDates.includes(currentDate)) currentDate = selDates[0];
  renderTabs();
  renderDate(currentDate);
  checkNewAvail();
}

function renderTabs() {
  document.getElementById('dateTabs').innerHTML = selDates.map(d => {
    const flights = results[d] || [];
    const av = flights.filter(f => f.available && inTime(f.depTime)).length;
    return `<div class="date-tab ${d===currentDate?'active':''}" onclick="selectDate('${d}')">${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6)}${av>0?`<span class="avail-cnt">${av}</span>`:''}</div>`;
  }).join('');
}

function selectDate(d) { currentDate = d; renderTabs(); renderDate(d); }

const logoMap = { LJ:'logo-lj', '7C':'logo-jc', TW:'logo-tw', OZ:'logo-oa', BX:'logo-bx', RS:'logo-rs' };

function renderDate(date) {
  const flights = results[date];
  const main = document.getElementById('main');

  if (!flights) {
    main.innerHTML = '<div class="no-data">조회 중...</div>';
    return;
  }

  const filtered = flights.filter(f => inTime(f.depTime));
  if (!filtered.length) {
    const naverUrl = `https://flight.naver.com/flights/domestic/GMP-CJU-${date}?adult=${cfg.adults||1}&child=${cfg.children||0}&infant=0`;
    main.innerHTML = `<div class="no-data">해당 시간대 항공편이 없거나 데이터를 불러오지 못했어요.<br><a href="${naverUrl}" target="_blank" class="naver-link">네이버 항공권에서 직접 확인 →</a></div>`;
    return;
  }

  const total = filtered.filter(f => f.available).length;
  const cnt = document.getElementById('alertCount');
  if (total > 0) { cnt.textContent = `🎉 ${date.slice(4,6)}/${date.slice(6)} 잔여 ${total}편`; cnt.style.display='inline'; }
  else cnt.style.display = 'none';

  main.innerHTML = filtered.map(f => {
    const logoClass = logoMap[f.airline] || 'logo-default';
    const sc = !f.available ? 'none' : f.seats <= 3 ? 'few' : 'ok';
    const seatLabel = !f.available ? '매진' : f.seats > 0 ? `${f.seats}석` : '잔여';
    return `<div class="flight-card ${f.available?'avail':''}" onclick="window.open('${f.bookingUrl}','_blank')">
      <div class="airline-logo ${logoClass}">${f.airline}</div>
      <div class="flight-info">
        <div class="flight-route">${f.depTime}<span>→</span>${f.arrTime}</div>
        <div class="flight-meta">${f.airlineName} ${f.flightNo}</div>
      </div>
      <div class="flight-right">
        ${f.price ? `<div class="flight-price">₩${Number(f.price).toLocaleString()}<small>/인</small></div>` : ''}
        <div class="avail-badge avail-${sc}">${f.available?`<span class="avail-dot"></span>`:''}${seatLabel}</div>
      </div>
    </div>`;
  }).join('');
}

function checkNewAvail() {
  const keys = new Set(), newOnes = [];
  Object.entries(results).forEach(([date, flights]) => {
    (flights||[]).filter(f=>f.available&&inTime(f.depTime)).forEach(f => {
      const k = `${f.airline}-${f.flightNo}-${date}`;
      keys.add(k);
      if (!prevKeys.has(k)) newOnes.push(`${f.airlineName} ${f.flightNo} ${f.depTime}`);
    });
  });
  if (newOnes.length && Notification.permission === 'granted') {
    new Notification('✈️ 잔여석 발견!', {body: newOnes.join('\n')}); beep();
  }
  prevKeys = keys;
  localStorage.setItem('availKeys', JSON.stringify([...keys]));
}

function beep() {
